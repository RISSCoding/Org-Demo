name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portal_test
      AUTH_SECRET: ci-only-secret
      QR_HMAC_SECRET: ci-only-qr-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      # Prisma generate butuh trustedDependencies di package.json agar engine native ikut terunduh.
      - run: bunx prisma generate

      # Menjalankan seluruh migrasi dari nol sekaligus memverifikasi bahwa migrasi dan schema.prisma tidak berselisih.
      - run: bunx prisma migrate deploy

      - name: Schema sama dengan migrasi
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE portal_shadow"
          bunx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres:postgres@localhost:5432/portal_shadow \
            --exit-code

      - run: bun run lint
      - run: bunx next typegen
      - run: bunx next typegen
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
