name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: himman_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/himman_test
      AUTH_SECRET: ci-only-secret
      QR_HMAC_SECRET: ci-only-qr-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      # Menjalankan seluruh migrasi dari nol sekaligus memverifikasi bahwa migrasi dan schema.prisma tidak berselisih.
      - run: npx prisma migrate deploy
      - name: Schema sama dengan migrasi
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE himman_shadow"
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres:postgres@localhost:5432/himman_shadow \
            --exit-code

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
